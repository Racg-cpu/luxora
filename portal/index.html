<style>
/* Concepto: "noche de gala". Marino profundo del logo, paneles de cristal con filo dorado y luz dorada y azul
   detrás. El oro se reserva para el logo, las cifras clave y la acción principal. Un solo mundo visual (oscuro). */
:root {
  --bg: #001f3f;
  --bg-deep: #00142a;
  --ink: #f3eee2;
  --muted: #a9b4c6;
  --line: rgba(226, 194, 122, 0.16);
  --glass: rgba(255, 255, 255, 0.07);
  --glass-hi: rgba(10, 34, 66, 0.92);
  --glass-lo: rgba(0, 20, 42, 0.38);
  --rim: rgba(226, 194, 122, 0.28);
  --rim-lo: rgba(0, 0, 0, 0.3);
  --spec: rgba(255, 255, 255, 0.14);
  --shadow: 0 20px 56px rgba(0, 8, 24, 0.5);
  --veil: rgba(0, 8, 22, 0.62);
  --gold: #e2c27a;
  --gold-deep: #9d791c;
  --btn: linear-gradient(180deg, #e2c27a, #b8902f);
  --btn-solid: #e2c27a;
  --btn-fg: #001f3f;
  --field: rgba(0, 20, 42, 0.55);
  --au1: #b08a2e; --au2: #1d4f91; --au3: #0d3166; --au4: #0f3a73; --au5: #17427c;
  --iri: linear-gradient(180deg, #f3dca6, #c9a34e);
  --late: #ff9b8f; --late-bg: rgba(255, 90, 80, 0.16);
  --soon: #f3c46b; --soon-bg: rgba(226, 160, 40, 0.18);
  --ok: #9be6bd; --ok-bg: rgba(60, 200, 130, 0.16);
  --info: #a9c4ff; --info-bg: rgba(90, 140, 255, 0.18);
  --pub: #d6bcff; --pub-bg: rgba(160, 110, 255, 0.18);
  --idle: #c4cbd8; --idle-bg: rgba(255, 255, 255, 0.08);
  --n0: #7fa6ff; --n1: #5fd0be; --n2: #ff9b7a; --n3: #b99bff; --n4: #f3c46b; --n5: #ff8fb8;
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body: "Hanken Grotesk", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "Hanken Grotesk", -apple-system, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
img { max-width: 100%; }

/* Aurora */
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; filter: blur(120px); opacity: 0.42; animation: flota 30s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { background: var(--au1); top: -24vmax; left: -18vmax; width: 46vmax; height: 46vmax; opacity: 0.26; }
.aurora i:nth-child(2) { background: var(--au2); top: -12vmax; right: -20vmax; animation-duration: 36s; }
.aurora i:nth-child(3) { background: var(--au3); bottom: -24vmax; left: 8vmax; animation-duration: 33s; }
.aurora i:nth-child(4) { background: var(--au4); bottom: -22vmax; right: -10vmax; animation-duration: 40s; opacity: 0.55; }
.aurora i:nth-child(5) { background: var(--au5); top: 28%; left: 34%; width: 40vmax; height: 40vmax; animation-duration: 27s; opacity: 0.5; }
body[data-page="mesa"] .aurora i { opacity: 0.5; }
.aurora i:nth-child(2), .aurora i:nth-child(4) { opacity: 0.6; }
@keyframes flota { to { transform: translate3d(7vmax, 5vmax, 0) scale(1.14); } }

.app { position: relative; z-index: 1; max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }

/* Cristal */
.glass {
  position: relative;
  background: var(--glass);
  -webkit-backdrop-filter: blur(26px) saturate(140%);
  backdrop-filter: blur(26px) saturate(140%);
  border: 1px solid var(--rim);
  border-radius: 28px;
  box-shadow: inset 0 1px 0 var(--spec), inset 0 -1px 0 var(--rim-lo), var(--shadow);
}
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.1) 0%, transparent 40%);
  opacity: 1;
}
.glass > * { position: relative; }

/* Barra superior */
.barra-top {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px 12px;
  padding: 8px 8px 8px 12px;
  border-radius: 999px;
  flex-wrap: wrap;
}
.marca { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.wordmark { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.04em; }
.marca .wordmark { font-size: 1.6rem; color: var(--gold); letter-spacing: 0.04em; }
.logo {
  width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; overflow: hidden;
  background: none; color: var(--gold);
  font-family: var(--f-display); font-weight: 700; font-size: 1.4rem;
}
.logo.con-img { background: none; border-radius: 0; overflow: visible; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.logo.xl { width: 88px; height: 88px; font-size: 3rem; }
.logo-completo { width: 200px; max-width: 70%; height: auto; display: block; }
.nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.nav a, .nav button {
  text-decoration: none; white-space: nowrap; border: 0; background: none;
  padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted);
}
.nav a:hover, .nav button:hover { color: var(--ink); background: var(--glass-lo); }
.nav a[aria-current="page"] { background: var(--btn-solid); color: var(--btn-fg); }
.quien { font-size: 13px; color: var(--muted); font-weight: 600; padding-inline: 6px; white-space: nowrap; }
.banda {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-radius: 18px; font-weight: 600; font-size: 14px;
}

/* Tipografía */
.kicker { margin: 0; font-family: var(--f-body); font-size: 12.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.iri { color: var(--gold); font-style: italic; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(2.6rem, 7vw, 4.8rem); line-height: 0.95; letter-spacing: -0.01em; }
.h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.9rem, 3.6vw, 2.5rem); line-height: 1.1; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.h2 .n { font-family: var(--f-mono); font-size: 0.8rem; font-weight: 500; color: var(--muted); }
.h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; }
.lead { margin: 0; color: var(--muted); font-size: 1.08rem; max-width: 62ch; }
.lead b { color: var(--ink); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.seccion { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.seccion-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Botones y campos */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--btn); color: var(--btn-fg); border: 0; border-radius: 999px;
  padding: 10px 18px; font-weight: 700; font-size: 14.5px; text-decoration: none; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 10px 26px rgba(157, 121, 28, 0.32);
  position: relative; overflow: hidden; transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%); transform: translateX(-120%); transition: transform 0.7s var(--ease); }

.vacio { padding: 26px 18px; border-radius: 24px; border: 1.5px dashed var(--line); color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.vacio strong { color: var(--ink); font-family: var(--f-display); font-size: 1.1rem; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: min(560px, calc(100% - 32px)); padding: 12px 18px; border-radius: 22px; font-weight: 600; font-size: 14px; background: var(--glass-hi); }
.cargando { padding: 60px 0; text-align: center; color: var(--muted); font-weight: 600; }


/* Animaciones */
@keyframes sube { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
@keyframes crece { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes gira { from { opacity: 0; transform: rotate(-120deg) scale(0.85); } to { opacity: 1; transform: none; } }
@keyframes hoja { from { opacity: 0; transform: translateY(26px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes destello { 0%, 72% { transform: translateX(-130%) skewX(-18deg); } 100% { transform: translateX(230%) skewX(-18deg); } }
@keyframes respira { 0%, 100% { filter: drop-shadow(0 0 0 rgba(226, 194, 122, 0)); } 50% { filter: drop-shadow(0 0 18px rgba(226, 194, 122, 0.45)); } }
@keyframes pulso { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 155, 143, 0.45); } 60% { box-shadow: 0 0 0 7px rgba(255, 155, 143, 0); } }
.entra > * { animation: sube 0.7s var(--ease) both; }
.entra > *:nth-child(2) { animation-delay: 0.08s; } .entra > *:nth-child(3) { animation-delay: 0.16s; }
.entra > *:nth-child(4) { animation-delay: 0.24s; } .entra > *:nth-child(n+5) { animation-delay: 0.32s; }
.entra > .seccion > *, .entra .bento > * { animation: sube 0.75s var(--ease) both; }
.entra > .seccion > *:nth-child(2), .entra .bento > *:nth-child(2) { animation-delay: 0.1s; }
.entra > .seccion > *:nth-child(3), .entra .bento > *:nth-child(3) { animation-delay: 0.18s; }
.entra > .seccion > *:nth-child(4), .entra .bento > *:nth-child(4) { animation-delay: 0.26s; }
.entra > .seccion > *:nth-child(n+5), .entra .bento > *:nth-child(n+5) { animation-delay: 0.34s; }
.entra .stat { animation: sube 0.6s var(--ease) both; }
.entra .stat:nth-child(2) { animation-delay: 0.22s; } .entra .stat:nth-child(3) { animation-delay: 0.29s; }
.entra .stat:nth-child(4) { animation-delay: 0.36s; } .entra .stat:nth-child(5) { animation-delay: 0.43s; }
.entra .stat:nth-child(1) { animation-delay: 0.15s; }
.entra .card, .entra .tile, .entra .destacada, .entra .burbuja, .entra .dia { animation: sube 0.65s var(--ease) both; }
.entra .grid-img > :nth-child(2), .entra .grid-neg > :nth-child(2), .entra .carrusel > :nth-child(2), .entra .cal > :nth-child(2) { animation-delay: 0.06s; }
.entra .grid-img > :nth-child(3), .entra .grid-neg > :nth-child(3), .entra .carrusel > :nth-child(3), .entra .cal > :nth-child(3) { animation-delay: 0.12s; }
.entra .grid-img > :nth-child(4), .entra .cal > :nth-child(4) { animation-delay: 0.18s; }
.entra .grid-img > :nth-child(n+5), .entra .cal > :nth-child(n+5) { animation-delay: 0.24s; }
.entra .barra-col .b { animation: crece 0.9s var(--ease) both 0.35s; transform-origin: bottom; }
.entra .anillo svg { animation: gira 1.1s var(--ease) both 0.25s; }
.velo { animation: aparece 0.25s ease both; }
.hoja { animation: hoja 0.42s var(--ease) both; }
.toast { animation: sube 0.4s var(--ease) both; }
.card, .tile, .burbuja, .destacada, button.fila, a.fila { transition: transform 0.35s var(--ease), border-color 0.35s, box-shadow 0.35s, background 0.35s; }
.card:hover, .tile:hover, .burbuja:hover, .destacada:hover { transform: translateY(-4px); border-color: rgba(226, 194, 122, 0.55); box-shadow: inset 0 1px 0 var(--spec), 0 26px 60px rgba(0, 8, 24, 0.6), 0 0 0 1px rgba(226, 194, 122, 0.15); }
button.fila:hover, a.fila:hover { transform: translateX(3px); border-color: rgba(226, 194, 122, 0.45); }
.thumb img { transition: transform 0.6s var(--ease); }
.card:hover .thumb img { transform: scale(1.04); }
.brillo { position: relative; display: inline-block; overflow: hidden; }
.brillo img { animation: respira 5s ease-in-out infinite 0.8s; }
.login-card .logo-completo, .login-card .logo.xl { animation: respira 5s ease-in-out infinite; }
.pill.e-late { animation: pulso 2.4s ease-out infinite; }
.marca .logo { transition: transform 0.5s var(--ease); }
.marca:hover .logo { transform: rotate(-6deg) scale(1.06); }

  .w-8, .w-7, .w-6, .w-5, .w-4 { grid-column: span 12; }

  .form, .credencial { grid-template-columns: 1fr; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

        add(actBox, h("button", { class: "fila", type: "button", onclick: function () { abrirImagen(i.id); } }, thumb(i, "mini"),
          h("div", { class: "fila-mid" }, h("span", { class: "fila-titulo" }, x.c.tipo === "aprobado" ? "Aprobó " + i.titulo : x.c.tipo === "cambios" ? "Pidió cambios en " + i.titulo : x.c.tipo === "cambios_caption" ? "Pidió cambios en la descripción de " + i.titulo : x.c.tipo === "aprobado_caption" ? "Aprobó la descripción de " + i.titulo : "Comentó en " + i.titulo), h("span", { class: "fila-sub" }, marcadorNeg(negPorId(i.negocioId)), fTs(x.c.ts))),
          h("span", { class: "pill " + (x.c.tipo === "aprobado" ? "e-ok" : x.c.tipo === "cambios" ? "e-late" : "e-idle") }, x.c.tipo === "aprobado" ? "Aprobó" : x.c.tipo === "cambios" ? "Cambios" : "Nota")));
      } else {
        add(actBox, h("a", { class: "fila", href: "#negocio-" + x.s.negocioId, style: "text-decoration:none" }, fechaNum(x.s.fecha, true),
          h("div", { class: "fila-mid" }, h("span", { class: "fila-titulo" }, "Pidió: " + x.s.titulo), h("span", { class: "fila-sub" }, marcadorNeg(negPorId(x.s.negocioId)), fTs(x.s.ts))),
          h("span", { class: "pill e-info" }, "Solicitud")));
      }
    });
    add(bento, h("section", { class: "w glass w-12" }, h("div", { class: "w-titulo" }, "Lo último de tus clientes"), act.length ? actBox : vacio("Sin actividad todavía", "Aprobaciones, cambios y solicitudes de tus clientes aparecen aquí.")));

    add(root, bento);
    return root;
  }

  /* ---------- arranque (Supabase) ---------- */
  var pollT = 0, listoT = 0;
  function docs(snap) { return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function errSnap(e) { if (e && e.code === "invalid_argument") aviso("Tu cuenta no tiene permiso para ver esta información."); }

  function limpiarDatos() {
    if (S.db && S.db.cerrar) S.db.cerrar();
    clearInterval(pollT); clearTimeout(listoT);
    S.db = null; S.assets = null; S.isOwner = false; S.isAdmin = false; S.escribe = null; S.verComo = null;
    S.negocios = []; S.imagenes = []; S.comentarios = []; S.solicitudes = []; S.reportes = []; S.accesos = []; S.tareas = []; S.marcas = []; S.anuncios = []; S.v5 = false;
    S.cargado = {}; S.listoTodo = false;
  }
  function cerrarSesion() {
    sb.auth.signOut().catch(function () {}).then(function () { S.authUid = null; S.authEmail = ""; limpiarDatos(); ir(""); render(); });
  }

  function iniciarSesion(ses) {
    limpiarDatos();
    if (!ses || !ses.user) { S.authUid = null; S.authEmail = ""; S.listo = true; render(); return; }
    S.authUid = ses.user.id; S.authEmail = ses.user.email || "";
    S.listo = false; render();
    sb.from("perfiles").select("rol,nombre").eq("id", S.authUid).maybeSingle().then(function (r) {
      if (S.authUid !== ses.user.id) return;
      var rol = r.data ? r.data.rol : "cliente";
      S.isOwner = S.isAdmin = rol === "admin";
      S.escribe = true;
      var db = S.db = crearDb();
      function sub(nombre, campo) {
        db.collection(nombre).onSnapshot(function (sn) { S[campo] = docs(sn); S.cargado[nombre] = true; refrescar(); }, errSnap);
      }
      sub("negocios", "negocios");
      sub("imagenes", "imagenes");
      sub("comentarios", "comentarios");
      sub("solicitudes", "solicitudes");
      sub("reportes", "reportes");
      sub("acceso", "accesos");
      db.doc("ajustes/marca").onSnapshot(function (sn) { S.marca = sn.exists ? sn.data() : {}; refrescar(); });
      if (S.isOwner) db.collection("privado/raul/tareas").onSnapshot(function (sn) { S.tareas = docs(sn); refrescar(); }, function () {});
      if (S.isAdmin) S.assets = crearAssets();
      // Anuncios (12-anuncios-y-aprobar-descripcion.sql): solo si la tabla existe.
      sb.from("anuncios").select("id").limit(1).then(function (r) { if (S.db === db && !r.error) sub("anuncios", "anuncios"); });
      // Mi marca (10-mi-marca.sql): solo si la tabla existe.
      sb.from("marcas").select("id").limit(1).then(function (r) { if (S.db === db && !r.error) sub("marcas", "marcas"); });
      // Campos extra de las solicitudes (5-campos-extra.sql). Si aún no se corre ese SQL, el portal funciona como antes.
      sb.from("solicitudes").select("detalles,fecha_borrador").limit(1).then(function (r) {
        if (S.db !== db || r.error) return;
        S.v5 = true; refrescar();
      });
      // Sin tiempo real: se vuelve a leer cada 20 s mientras la página está a la vista.
      pollT = setInterval(function () { if (document.visibilityState === "visible" && S.db) S.db.recargarTodo(); }, 20000);
      listoT = setTimeout(function () { S.listoTodo = true; refrescar(); }, 3500);
      S.listo = true; render();
    });
  }

  render();
  if (!window.supabase || !window.supabase.createClient) {
    S.listo = true; S.sinDatos = true; S.errorCarga = "No se pudo cargar la conexión con el servidor. Revisa tu internet y recarga la página."; render(); return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "luxora-auth" },
    global: { fetch: fetchPlano }
  });
  // La marca es pública: se lee antes de iniciar sesión para la pantalla de entrada.
  sb.from("ajustes").select("valor").eq("clave", "marca").maybeSingle().then(function (r) { if (r.data && r.data.valor) { S.marca = r.data.valor; refrescar(); } });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && S.db) S.db.recargarTodo(); });
  sb.auth.getSession().then(function (r) { iniciarSesion(r.data && r.data.session); }, function () { iniciarSesion(null); });
  sb.auth.onAuthStateChange(function (ev, ses) {
    if (ev === "SIGNED_OUT" && S.authUid) { S.authUid = null; limpiarDatos(); render(); }
    else if (ev === "SIGNED_IN" && ses && ses.user && ses.user.id !== S.authUid) iniciarSesion(ses);
  });
})();
</script>
